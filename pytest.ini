[pytest]
testpaths = tests
pythonpath = .
markers =
    slow: test lent (analyse librosa, ~2 s) — exclu du hook de fin de tour
filterwarnings =
    ignore::DeprecationWarning:audioread.*
    # fichier audio abîmé (tests/test_sources.py) : repli attendu de librosa
    ignore:PySoundFile failed:UserWarning
    ignore::FutureWarning:librosa.*

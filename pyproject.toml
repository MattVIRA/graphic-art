# Outillage qualité (T1.14). Lint seulement : pas de `ruff format`, qui
# réécrirait ~45 % des lignes et casserait les commentaires alignés.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes (PEP8, noms inutilisés…)
    "I",             # tri des imports
    "B",             # bugbear : pièges courants (dont B904, raise sans from)
    "E722",          # except nu
    "BLE001",        # except Exception : seulement aux frontières, avec # noqa justifié
    "S110", "S112",  # except … : pass / continue silencieux
    "T201",          # print : passer par logging (app/log.py, T1.15)
    "TRY400",        # dans un except : logger.exception plutôt que logger.error
    "C901",          # complexité > 10 : découper (T1.15)
    "ERA001",        # code commenté laissé en place
]

[tool.ruff.lint.per-file-ignores]
# outils en ligne de commande : leur sortie est faite pour la console
"tools/*" = ["T201"]
".claude/hooks/*" = ["T201"]
